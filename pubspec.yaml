name: cost_manager
description: "مدیریت هزینه ها - اپلیکیشن مدیریت مالی شخصی"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Settings
  shared_preferences: ^2.3.5

  # Persian date & numbers
  shamsi_date: ^1.1.1

  # Charts
  fl_chart: ^0.69.2

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Security
  local_auth: ^2.3.0

  # Export / share
  share_plus: ^10.1.4
  file_picker: ^8.1.6
  csv: ^6.0.0
  excel: ^4.0.6
  pdf: ^3.11.3

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
